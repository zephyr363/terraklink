map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size ${MAX_REQUEST_UPLOAD_MB}m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /static/ { alias /django-static/; }
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        # Uploaded files cannot run scripts even if a video container is malformed.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /assets/app.js { expires -1; try_files $uri =404; }
    location = /assets/app.css { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location = /admin { try_files $uri /index.html; }
    location = /analytics { try_files $uri /index.html; }
    location = /management { try_files $uri /index.html; }
    location = /analytics/ { try_files $uri /index.html; }
    location = /management/ { try_files $uri /index.html; }
    location /admin/ { try_files $uri /index.html; }
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
