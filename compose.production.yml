name: terraklink-production
services:
  postgres:
    image: postgres:17-alpine
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  cache:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    build: {context: ., dockerfile: infra/minio.Dockerfile}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DJANGO_DEBUG: '0'
      DJANGO_TRUST_PROXY_HEADERS: '1'
      POSTGRES_HOST: postgres
      REDIS_URL: redis://cache:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      cache: {condition: service_healthy}
      minio: {condition: service_started}
    command: /bin/sh -c 'python manage.py check --deploy --fail-level WARNING && python manage.py init_storage && python manage.py migrate --noinput && python manage.py seed_content && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -'
    volumes: [django-static:/app/backend/staticfiles]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-10}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-50}
    depends_on: {backend: {condition: service_healthy}}
    volumes: [django-static:/django-static:ro]
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ['${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80', '${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443', '${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp']
    volumes: ['./infra/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
  django-static:
  caddy-data:
  caddy-config:
