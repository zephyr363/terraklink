[project]
name = "terraklink"
version = "0.1.0"
description = "Corporate brick manufacturer website and content management API"
requires-python = ">=3.11"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5,<6",
  "django-storages[s3]>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pillow>=11,<13",
  "gunicorn>=23,<24; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11,<5",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
