name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: terraklink, POSTGRES_USER: terraklink, POSTGRES_PASSWORD: ci-test-password}
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_DEBUG: '1'
      POSTGRES_HOST: localhost
      POSTGRES_DB: terraklink
      POSTGRES_USER: terraklink
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.9.20', enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run backend/manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: Test Python Alpine image against PostgreSQL
        run: |
          docker build --target test -f backend/Dockerfile -t terraklink-api:test .
          docker run --rm --network host -e POSTGRES_HOST -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD terraklink-api:test
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {DJANGO_DEBUG: '1', DJANGO_SETTINGS_MODULE: 'config.browser_tests', E2E_EDITOR_PASSWORD: 'CI-Test-Password-42!', LOGIN_THROTTLE_RATE: '100/hour'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        # Optional cache upload stalled the previous web run after all tests passed.
        with: {version: '0.9.20', enable-cache: false}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
      - name: Verify nginx image and configurable upload limit
        run: |
          docker build -f frontend/Dockerfile -t terraklink-web:ci .
          docker run --rm --add-host backend:127.0.0.1 --add-host minio:127.0.0.1 -e MAX_IMAGE_UPLOAD_MB=4 -e MAX_VIDEO_UPLOAD_MB=8 terraklink-web:ci nginx -T 2>&1 | tee /tmp/nginx-config.txt
          grep -F 'client_max_body_size 9m;' /tmp/nginx-config.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          uv run --frozen scripts/prepare_browser_tests.py
          uv run backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/backend.log 2>&1 &
          cd frontend
          npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:5173/api/health/ && break || sleep 1; done
          npm run test:e2e
          cd ..
          docker run -d --name terraklink-nginx-smoke --network host --add-host backend:127.0.0.1 --add-host minio:127.0.0.1 terraklink-web:ci
          for i in $(seq 1 20); do curl --fail http://127.0.0.1/api/health/ && break || sleep 1; done
          uv run --frozen scripts/check_public_runtime.py --url http://127.0.0.1
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-test-results, path: frontend/test-results}
